name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly, to catch upstream breakage
  workflow_dispatch:

# Cancel superseded runs on PR branches, but let every run on main finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: write  # lets julia-actions/cache delete stale caches
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The quick core set on PRs; the full suite on main, tags, the weekly run and manual runs
      TEST_GROUP: ${{ github.event_name == 'pull_request' && 'basic' || 'all' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'  # lowest supported (compat)
          - '1'     # latest release
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # --check-bounds=yes (the Pkg.test default) roughly doubles kernel compilation time
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: auto
